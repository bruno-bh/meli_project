spring.application.name=product-api
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.com.meli.productapi=DEBUG

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Test data file configuration - isolated from production data
product.data.dir=data/test
product.data.file=data/test/products-test.json

# Test template file configuration
product.template.file=data/test/product-templates-test.yaml
