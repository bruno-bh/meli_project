spring.application.name=product-api
server.port=8080
server.servlet.context-path=/

# Forward headers (needed behind reverse proxy / HTTPS termination)
server.forward-headers-strategy=framework

# Logging
logging.level.root=INFO
logging.level.com.meli.productapi=DEBUG

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Data file configuration
product.data.dir=data
product.data.file=data/products.json

# Template file configuration
product.template.file=data/product-templates.yaml

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# API Security
api.security.enabled=true
api.security.key=meli-product-api-key-2025

# API Server URL (used in OpenAPI spec — set to your public HTTPS URL in production)
api.server.url=http://localhost:8080
