spring.application.name=product-api
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.com.meli.productapi=DEBUG

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Data file configuration
product.data.dir=data
product.data.file=data/products.json

# Template file configuration
product.template.file=data/product-templates.yaml

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# API Security
api.security.enabled=true
api.security.key=meli-product-api-key-2025
